{# Иконки — простые линии 24×24, цвет берут от текста (currentColor). #}
{% macro icon(name, size=18) -%}
<svg class="ic" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'want_to_read' -%}<path d="M6 3h12v18l-6-4-6 4z"/>

{%- elif name == 'paused' -%}<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>
{%- elif name == 'dnf' -%}<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>
{%- elif name == 'skipped' -%}<path d="m5 5 7 7-7 7M13 5l7 7-7 7"/>
{%- elif name == 'flame' -%}<path d="M12 22c4.4 0 7-2.8 7-6.8 0-3.6-2.3-6-4-8.2-.4 2-1.4 3.2-2.6 3.8C12.6 7.5 11 4.4 8.6 2c.2 3.3-1.5 5.6-3 7.6C4.6 11 4 12.8 4 15.2 4 19.2 7.6 22 12 22z"/><path d="M12 22c-1.9 0-3-1.3-3-3 0-1.9 1.4-3 2.2-4.4.6 1 1.4 1.5 2.1 1.6.4-.6.6-1.3.6-2 1.3 1.2 2.1 2.6 2.1 4.6 0 1.8-1.6 3.2-4 3.2z"/>
{%- elif name == 'star' -%}<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>
{%- elif name == 'tag' -%}<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.3"/>
{%- elif name == 'mood' -%}<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1.8 2 5.2 2 7 0M9 9.5h.01M15 9.5h.01"/>
{%- elif name == 'gear' -%}<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>

{%- elif name == 'refresh' -%}<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>
{%- elif name == 'chevron' -%}<path d="m6 9 6 6 6-6"/>
{%- elif name == 'calendar' -%}<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>
{%- endif -%}
</svg>
